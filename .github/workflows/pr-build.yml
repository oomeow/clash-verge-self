name: PR Check

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    strategy:
      fail-fast: true
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Check file changed
        uses: dorny/paths-filter@v3
        id: changes
        with:
          base: HEAD
          filters: |
            frontend:
              - 'src/**'
              - '**/package.json'
            backend:
              - 'src-tauri/**'
              - '**/Cargo.toml'
              - '**/Cargo.lock'
            bundle:
              - 'cross_dockerfile/**'
              - 'src-tauri/template/**'

      - name: Print file changed status
        run: |
          echo "Frontend changed: ${{ steps.changes.outputs.frontend }}"
          echo "Backend changed: ${{ steps.changes.outputs.backend }}"
          echo "Bundle changed: ${{ steps.changes.outputs.bundle }}"

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
        with:
          workspaces: src-tauri

      - name: Install Node
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6
        with:
          node-version: "24"

      - name: Install pnpm + deps
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4
        with:
          run_install: false

      - name: Pnpm install and check
        run: |
          pnpm i
          pnpm check --alpha
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # frontend build
      - name: frontend build
        if: steps.changes.outputs.frontend == 'true'
        run: pnpm web:build

      # rust clippy
      - name: rust clippy
        if: steps.changes.outputs.backend == 'true'
        run: |
          cd src-tauri
          cargo clippy

      # bundle build
      - name: Overwrite Tauri config
        if: steps.changes.outputs.bundle == 'true'
        run: |
          cp ./src-tauri/tauri.conf.pr.json ./src-tauri/tauri.conf.json

      - name: Build Tauri
        if: steps.changes.outputs.bundle == 'true'
        run: pnpm build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
