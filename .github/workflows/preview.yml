name: Preview Build

on:
  push:
    branches:
      - dev
      - feat/add-preview-release
    tags-ignore:
      - updater
      - alpha
      - preview
      - "v*"
      - "service-*"
  workflow_dispatch:

concurrency:
  # bot 提交的 run 会被跳过，但若与人工构建共用同一组会取消进行中的人工构建
  group: preview-${{ github.ref }}-${{ endsWith(github.actor, '[bot]') && 'bot' || 'human' }}
  cancel-in-progress: true

permissions: write-all
env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short

jobs:
  # only build for non-bot commits (e.g. skip commits pushed by github-actions[bot])
  prepare:
    if: ${{ !endsWith(github.actor, '[bot]') }}
    runs-on: ubuntu-latest
    outputs:
      VERSION: ${{ steps.version.outputs.VERSION }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Compute Preview Version
        id: version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BASE=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "base version: ${BASE}"
          ESCAPED=$(printf '%s' "$BASE" | sed 's/\./\\./g')
          RE="(?:^|[_-])${ESCAPED}-pre\\.([0-9]+)"

          # count builds from the existing preview release assets
          ASSETS=$(curl -sS -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/preview")
          MAX_ASSET=$(printf '%s' "$ASSETS" | jq -r --arg re "$RE" \
            '[(.assets // [])[].name | match($re) | .captures[0].string | tonumber] | max // 0')

          # count builds from the committed preview-update.json on the updater release
          MAX_JSON=0
          PREVIEW_JSON_URL=$(curl -sS -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/updater" | jq -r \
            '[(.assets // [])[] | select(.name == "preview-update.json") | .browser_download_url] | first // empty')
          if [ -n "$PREVIEW_JSON_URL" ]; then
            PRE_VER=$(curl -sS "$PREVIEW_JSON_URL" | jq -r '.name // empty')
            case "$PRE_VER" in
              "${BASE}-pre."*)
                MAX_JSON=$(printf '%s' "$PRE_VER" | sed "s/^${ESCAPED}-pre\\.//" | sed 's/[^0-9].*//')
                ;;
            esac
          fi

          MAX=$((MAX_ASSET > MAX_JSON ? MAX_ASSET : MAX_JSON))
          NEXT=$((MAX + 1))
          echo "VERSION=${BASE}-pre.${NEXT}" >> "$GITHUB_OUTPUT"
          echo "next preview version: ${BASE}-pre.${NEXT}"

  delete-release-assets:
    needs: [prepare]
    runs-on: ubuntu-latest
    steps:
      - name: Delete old release assets
        uses: mknejp/delete-release-assets@v1
        with:
          token: ${{ github.token }}
          tag: preview
          fail-if-no-assets: false
          fail-if-no-release: false
          assets: |
            *.rpm
            *.deb
            *.zst
            *.dmg
            *.exe
            *.gz
            *.sig
            *.zip
            *.json

  preview:
    needs: [prepare, delete-release-assets]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            target: i686-pc-windows-msvc
          - os: windows-latest
            target: aarch64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Add Rust Target
        run: rustup target add ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        name: Install pnpm
        with:
          run_install: false

      - name: Pnpm install and check
        run: |
          pnpm i
          pnpm check --target ${{ matrix.target }} --no-confirm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLASH_VERGE_SELF_SERVICE_PSK: ${{secrets.CLASH_VERGE_SELF_SERVICE_PSK}}

      - name: Tauri build
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CLASH_VERGE_SELF_SERVICE_PSK: ${{secrets.CLASH_VERGE_SELF_SERVICE_PSK}}
        with:
          tagName: preview
          releaseName: "Clash Verge Self Preview ${{ needs.prepare.outputs.VERSION }}"
          releaseBody: "Preview build ${{ needs.prepare.outputs.VERSION }}"
          releaseDraft: false
          prerelease: true
          tauriScript: pnpm
          args: --target ${{ matrix.target }} --config src-tauri/tauri.conf-preview.json --config '{"version":"${{ needs.prepare.outputs.VERSION }}"}'

      - name: Portable Bundle
        if: matrix.os == 'windows-latest'
        run: pnpm portable --target ${{ matrix.target }} --preview --version ${{ needs.prepare.outputs.VERSION }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  preview-for-linux:
    needs: [prepare, delete-release-assets]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04
            target: i686-unknown-linux-gnu
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
          - os: ubuntu-22.04
            target: armv7-unknown-linux-gnueabihf

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: dev

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Add Rust Target
        run: rustup target add ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Binstall
        if: matrix.target != 'x86_64-unknown-linux-gnu'
        uses: cargo-bins/cargo-binstall@b5723a5790b379eeac6713950acef86189492996 # main

      - name: Install Cross
        if: matrix.target != 'x86_64-unknown-linux-gnu'
        run: cargo binstall -y cross

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        name: Install pnpm
        with:
          run_install: false

      - name: Pnpm install and check
        run: |
          pnpm i
          pnpm check --target ${{ matrix.target }} --no-confirm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLASH_VERGE_SELF_SERVICE_PSK: ${{secrets.CLASH_VERGE_SELF_SERVICE_PSK}}

      - name: Tauri build (x86_64)
        if: startsWith(matrix.target, 'x86_64')
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CLASH_VERGE_SELF_SERVICE_PSK: ${{secrets.CLASH_VERGE_SELF_SERVICE_PSK}}
        run: |
          pnpm build --target ${{ matrix.target }} --config src-tauri/tauri.conf-preview.json --config '{"version":"${{ needs.prepare.outputs.VERSION }}"}'

      - name: Tauri build (other)
        if: matrix.target != 'x86_64-unknown-linux-gnu'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CLASH_VERGE_SELF_SERVICE_PSK: ${{secrets.CLASH_VERGE_SELF_SERVICE_PSK}}
        run: |
          pnpm build -r cross --target ${{ matrix.target }} -b deb,rpm --config src-tauri/tauri.conf-preview.json --config '{"version":"${{ needs.prepare.outputs.VERSION }}"}'

      - name: Portable Bundle (Linux)
        run: pnpm portable --target ${{ matrix.target }} --preview --version ${{ needs.prepare.outputs.VERSION }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: preview
          name: "Clash Verge Self Preview"
          prerelease: true
          token: ${{ secrets.RELEASE_TOKEN }}
          files: |
            target/${{ matrix.target }}/release/bundle/deb/*.deb
            target/${{ matrix.target }}/release/bundle/deb/*.deb.sig
            target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            target/${{ matrix.target }}/release/bundle/rpm/*.rpm.sig

  release-update:
    needs: [prepare, preview, preview-for-linux]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Update release name and body
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit preview \
            --title "Clash Verge Self Preview ${{ needs.prepare.outputs.VERSION }}" \
            --body "Preview build ${{ needs.prepare.outputs.VERSION }}"

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        name: Install pnpm
        with:
          run_install: false

      - name: Pnpm install
        run: pnpm i
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release preview updater file
        run: pnpm updater --preview
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
