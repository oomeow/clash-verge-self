name: Check

on:
  push:
    branches:
      - dev
  pull_request:
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short

jobs:
  check:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            target: i686-pc-windows-msvc
          - os: windows-latest
            target: aarch64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04
            target: i686-unknown-linux-gnu
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
          - os: ubuntu-22.04
            target: armv7-unknown-linux-gnueabihf

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check file changed
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: changes
        with:
          filters: |
            frontend:
              - 'src/**'
              - '**/package.json'
              - '**/pnpm-lock.yaml'
            backend:
              - 'src-tauri/**'
              - '**/Cargo.toml'
              - '**/Cargo.lock'
              - 'crates/**'
            bundle:
              - 'cross_dockerfile/**'
              - 'src-tauri/template/**'

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Add Rust Target
        run: rustup target add ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Configure Fast APT Mirror
        if: matrix.os == 'ubuntu-22.04'
        uses: vegardit/fast-apt-mirror.sh@v1
        with: # the following parameters are listed with their action default values and are optional
          healthchecks: 20 # Number of mirrors from the mirrors list to check for availability and up-to-dateness
          speedtests: 10 # Maximum number of healthy mirrors to test for speed
          parallel: 2 # Number of parallel speed tests
          sample-size: 1024 # Number of kilobytes to download during the speed from each mirror
          sample-time: 3 # Maximum number of seconds within the sample download from a mirror must finish
          country: "" # The country code for selecting Ubuntu mirrors. If not set, defaults to http://mirrors.ubuntu.com/mirrors.txt
          exclude-current: false # If set to "true", don't include the current APT mirror in the speed tests
          configure-mirror: auto # Whether to configure the APT mirror: auto, true, or false

      - name: Install Packages
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Binstall
        if: matrix.os == 'ubuntu-22.04' && matrix.target != 'x86_64-unknown-linux-gnu'
        uses: cargo-bins/cargo-binstall@b629f84e79e8fbc4f76616a8efd340f3ea605cab # main

      - name: Install Cross
        if: matrix.os == 'ubuntu-22.04' && matrix.target != 'x86_64-unknown-linux-gnu'
        run: cargo binstall -y cross

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false

      - name: Pnpm install and check
        run: |
          pnpm i
          pnpm check --target ${{ matrix.target }} --alpha --no-confirm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLASH_VERGE_SELF_SERVICE_PSK: ${{secrets.CLASH_VERGE_SELF_SERVICE_PSK}}

      # frontend lint
      - name: frontend lint
        run: pnpm lint

      # frontend build (always build)
      - name: frontend build
        run: pnpm web:build

      # rust clippy
      # 指定 --target 与 pnpm check 下载 sidecar 的目标一致，否则 tauri-build 按宿主机目标校验 externalBin，交叉目标下会因 sidecar 缺失而失败
      - name: Rust clippy
        if: steps.changes.outputs.backend == 'true' && !(matrix.os == 'ubuntu-22.04' && matrix.target != 'x86_64-unknown-linux-gnu')
        run: |
          cargo clippy --all-targets --all-features --tests --target ${{ matrix.target }} -- -D warnings

      # Linux 非 x86_64 使用 cross 在 docker 内交叉检查（宿主机缺少目标依赖）
      - name: Rust clippy (Linux cross)
        if: steps.changes.outputs.backend == 'true' && matrix.os == 'ubuntu-22.04' && matrix.target != 'x86_64-unknown-linux-gnu'
        run: |
          cross clippy --all-targets --all-features --tests --target ${{ matrix.target }} -- -D warnings

      # 仅当修改了 bundle 相关文件时才构建应用
      - name: Build Tauri (Linux x86_64)
        if: steps.changes.outputs.bundle == 'true' && matrix.target == 'x86_64-unknown-linux-gnu'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          pnpm build --target ${{ matrix.target }} -c ./src-tauri/tauri.conf-check.json

      - name: Build Tauri (Linux cross)
        if: steps.changes.outputs.bundle == 'true' && matrix.os == 'ubuntu-22.04' && matrix.target != 'x86_64-unknown-linux-gnu'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          pnpm build -r cross --target ${{ matrix.target }} -b deb,rpm -c ./src-tauri/tauri.conf-check.json

      - name: Build Tauri (Windows/macOS)
        if: steps.changes.outputs.bundle == 'true' && matrix.os != 'ubuntu-22.04'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          pnpm build --target ${{ matrix.target }} -c ./src-tauri/tauri.conf-check.json
