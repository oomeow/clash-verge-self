name: Build dist-js

on:
  push:
    branches:
      - dev
    paths:
      - "crates/tauri-plugin-mihomo/guest-js/**"
      - "crates/tauri-plugin-mihomo/src/models.rs"
  workflow_dispatch:

permissions: write-all

concurrency:
  group: build-dist-js-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check Mihomo changed
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            mihomo:
              - 'crates/tauri-plugin-mihomo/guest-js/**'
              - 'crates/tauri-plugin-mihomo/src/models.rs'

      - name: install webkit2gtk
        if: steps.filter.outputs.mihomo == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev

      - name: Install Rust Stable
        if: steps.filter.outputs.mihomo == 'true'
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Rust Cache
        if: steps.filter.outputs.mihomo == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install Node
        if: steps.filter.outputs.mihomo == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - name: Install pnpm
        if: steps.filter.outputs.mihomo == 'true'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false

      - name: Build mihomo api
        if: steps.filter.outputs.mihomo == 'true'
        run: |
          pnpm i
          pnpm build:mihomo-api
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check file changed
        if: steps.filter.outputs.mihomo == 'true'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: changes
        with:
          base: HEAD
          filters: |
            frontend:
              - 'crates/tauri-plugin-mihomo/dist-js/**'
              - 'crates/tauri-plugin-mihomo/guest-js/**'

      - name: Update dist-js or guest-js
        if: steps.filter.outputs.mihomo == 'true' && steps.changes.outputs.frontend == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add crates/tauri-plugin-mihomo/dist-js crates/tauri-plugin-mihomo/guest-js
          git commit -m "chore: update tauri-plugin-mihomo frontend code"
          git push origin dev
