name: Build dist-js

on:
  workflow_dispatch:
  # push:
  #   branches:
  #     - dev
  #   paths:
  #     - "crates/tauri-plugin-mihomo/guest-js/**"
  #     - "crates/tauri-plugin-mihomo/src/models.rs"

permissions: write-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: install webkit2gtk
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        name: Install pnpm
        with:
          run_install: false

      - name: Build mihomo api
        run: |
          pnpm i
          pnpm build:mihomo-api
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check file changed
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4
        id: changes
        with:
          base: HEAD
          filters: |
            frontend:
              - 'crates/tauri-plugin-mihomo/dist-js/**'
              - 'crates/tauri-plugin-mihomo/guest-js/**'

      - name: Update dist-js or guest-js
        if: steps.changes.outputs.frontend == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add crates/tauri-plugin-mihomo/dist-js crates/tauri-plugin-mihomo/guest-js
          git commit -m "chore: update tauri-plugin-mihomo frontend code"
          git push origin dev
