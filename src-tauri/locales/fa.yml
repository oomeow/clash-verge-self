notice:
  disable:
    failed: غیرفعال‌سازی ناموفق بود
  enable:
    failed: فعال‌سازی ناموفق بود
  install:
    failed: نصب ناموفق بود
  service:
    install:
      run:
        failed: نصب با موفقیت انجام شد، اما اجرای سرویس Clash Verge Self Service ناموفق بود
        success: سرویس Clash Verge Self Service با موفقیت نصب و اجرا شد
  import:
    success: فایل اشتراک با موفقیت وارد شد
    failed: ورود فایل اشتراک ناموفق بود

dialog:
  install:
    service:
      ask: "سرویس Clash Verge Self Service نصب نشده است\nآیا می‌خواهید اکنون سرویس را نصب و اجرا کنید؟"
  panic:
    title: خرابی Clash Verge Self
    backtrace: "ردیابی پشته:\n%{backtrace}"
    displayBacktraceNote: "نکته: برای نمایش backtrace برنامه را با متغیر محیطی `RUST_BACKTRACE=1` اجرا کنید"
    content: "موقعیت: %{location}:\n\n%{payload}\n\n%{limit_backtrace}...\n\nبرای اطلاعات بیشتر درباره panic، فایل‌های گزارش را بررسی کنید:\n  گزارش برنامه: %{app_log_file}\n  گزارش Clash: %{clash_log_file}"

error:
  tun:
    busy: دستگاه Tun یا منبع درگیر است؛ راه‌اندازی مجدد هسته ممکن است مشکل را برطرف کند
    needPermissions: پیش از روشن کردن حالت Tun، مجوزهای لازم را به هسته بدهید یا حالت سرویس را نصب و فعال کنید
  config:
    parseFailed: تجزیه پیکربندی به‌عنوان فایل YAML ناموفق بود
    convertFailed: تبدیل پیکربندی به YAML ناموفق بود
  runtime:
    config:
      getFailed: دریافت پیکربندی زمان اجرا ناموفق بود
  clash:
    restartFailed: راه‌اندازی مجدد هسته Clash ناموفق بود
  sysproxy:
    updateFailed: به‌روزرسانی پراکسی سیستم ناموفق بود
    pac:
      updateFailed: به‌روزرسانی تنظیمات پراکسی PAC ناموفق بود
