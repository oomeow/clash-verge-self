tray:
  dashboard: 打开面板
  mode:
    rule: 规则模式
    global: 全局模式
    direct: 直连模式
  proxy:
    system: 系统代理
    tun: Tun 代理
  service: 服务模式
  copy:
    env: 复制环境变量
  open:
    dir: 打开目录
    app:
      dir: 应用目录
    core:
      dir: 内核目录
    log:
      dir: 日志目录
    devtools: 打开开发者工具
  more: 更多
  restart:
    clash: 重启 Clash
    app: 重启应用
  quit: 退出
  current:
    profile: 当前订阅
  profiles:
    switch:
      title: 切换订阅
      success: 切换订阅成功
      failed: 切换订阅失败

notice:
  disable:
    failed: 禁用失败
  enable:
    failed: 启用失败
  install:
    failed: 安装失败
  service:
    install:
      run:
        failed: 安装成功，但 Clash Verge Self Service 服务启动失败
        success: Clash Verge Self Service 服务安装并启动成功
  import:
    success: 导入订阅文件成功
    failed: 导入订阅文件失败

dialog:
  install:
    service:
      ask: "Clash Verge Self Service 服务未安装\n是否现在安装并运行服务？"
  panic:
    title: Clash Verge Self 崩溃
    backtrace: "堆栈回溯:\n%{backtrace}"
    displayBacktraceNote: "注：使用 `RUST_BACKTRACE=1` 环境变量运行以显示回溯"
    content: "位置： %{location}:\n\n%{payload}\n\n%{limit_backtrace}...\n\n有关更多恐慌信息，请检查日志文件:\n  应用日志：%{app_log_file}\n  Clash 日志：%{clash_log_file}"

error:
  tun:
    busy: Tun 设备或资源繁忙, 重启核心也许能解决问题
    needPermissions: 请在开启 Tun 模式前给核心授权, 或者安装并启用服务模式
  config:
    parseFailed: 无法将配置解析为 yaml 文件
    convertFailed: 无法将配置转换为 yaml
  runtime:
    config:
      getFailed: 无法获取运行时配置
  clash:
    restartFailed: Clash 核心重启失败
  sysproxy:
    updateFailed: 无法更新系统代理
    pac:
      updateFailed: 无法更新 PAC 代理设置
