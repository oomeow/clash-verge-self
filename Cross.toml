[target.i686-unknown-linux-gnu]
# dockerfile = "cross_dockerfile/debian/i686/Dockerfile"
image = "ghcr.io/oomeow/builder_debian_trixie_i686:latest"
pre-build = [
  "apt-get install -y clang:i386 libclang-dev:i386"
]

[target.aarch64-unknown-linux-gnu]
# dockerfile = "cross_dockerfile/ubuntu/aarch64/Dockerfile"
image = "ghcr.io/oomeow/builder_ubuntu_22.04_aarch64:latest"
pre-build = [
  "apt-get install -y clang:arm64 libclang-dev:arm64"
]

[target.armv7-unknown-linux-gnueabihf]
# dockerfile = "cross_dockerfile/ubuntu/armhf/Dockerfile"
image = "ghcr.io/oomeow/builder_ubuntu_22.04_armhf:latest"
pre-build = [
  "apt-get install -y clang:armhf libclang-dev:armhf"
]
